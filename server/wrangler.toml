# 지역왕 게임 서버 설정. 계정 ID·실제 database_id는 여기에 적지 않습니다(README의 "배포" 참고).
name = "region-king-server"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "region-king"
# 자리표시자입니다. 배포 때 `wrangler d1 create region-king`이 알려 주는 값으로 바꿉니다.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
# 화면 주소(쉼표로 구분). 로컬 개발용 주소만 넣어 둡니다. 운영 주소는 배포 때 추가합니다.
ALLOWED_ORIGINS = "http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:8080,http://localhost:8080"
