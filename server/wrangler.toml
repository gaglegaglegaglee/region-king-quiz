# 지역왕 게임 서버 설정. 계정 ID와 토큰은 여기에 적지 않습니다(환경변수 CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN으로만).
# database_id는 열쇠가 아니라 저장소 번호라서 적어도 됩니다.
name = "region-king-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "region-king-db"
database_id = "7c52f52f-1606-4f42-8735-917834a1845f"
migrations_dir = "migrations"

[vars]
# 화면 주소(쉼표로 구분). 운영에는 GitHub Pages 주소만 둡니다.
# 내 컴퓨터에서 시험할 때의 주소는 server/.dev.vars 파일(저장소에 안 올라감)에 적습니다. README 참고.
ALLOWED_ORIGINS = "https://gaglegaglegaglee.github.io"

[triggers]
# 매일 새벽 3시(UTC) 7일 지난 게임 판 기록 삭제
crons = ["0 3 * * *"]

# 남용 방지: 주소(IP)별 분당 상한(Cloudflare Rate Limiting 바인딩). period는 10 또는 60초만 가능.
[[ratelimits]]
name = "START_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "ANSWER_LIMITER"
namespace_id = "1002"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "SCORE_LIMITER"
namespace_id = "1003"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "ADMIN_LIMITER"
namespace_id = "1004"
simple = { limit = 20, period = 60 }
