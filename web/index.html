<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>VS · 지역 비교 퀴즈</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <main class="screen" id="home" aria-labelledby="title">
      <header class="hero">
        <h1 id="title">VS</h1>
        <p class="tagline" id="tagline">비교하면, 우리나라가 보인다. 공공데이터 지역 비교 퀴즈</p>
      </header>

      <section class="topics" id="topics" aria-label="주제 고르기"></section>

      <button type="button" class="btn rank-btn" id="rank-btn"><img class="emoji-image inline-emoji" src="assets/emoji/trophy.svg" alt=""> 순위표 보기</button>

      <p class="toast" id="toast" role="status" aria-live="polite"></p>
    </main>

    <main class="screen" id="game" hidden aria-label="게임 화면">
      <div class="game-top">
        <p class="streak" id="g-streak" aria-live="polite"><img class="emoji-image inline-emoji" src="assets/emoji/fire.svg" alt=""> <span id="g-streak-n">0</span>연승</p>
        <p class="qnum" id="g-num"></p>
      </div>
      <div class="timer" id="g-timer" aria-hidden="true"><div class="timer-fill" id="g-fill"></div></div>
      <h2 class="question" id="g-question"></h2>
      <p class="refline" id="g-basis" hidden></p><div id="g-geography" hidden></div>
      <div class="choices" id="g-choices"></div>
      <p class="verdict" id="g-verdict" role="status" aria-live="assertive" tabindex="-1"></p>
      <p class="refline" id="g-ref"></p><p class="refline" id="g-explanation"></p>
      <button type="button" class="btn quit-btn" id="g-quit">그만하기</button>
      <div class="end" id="g-err" hidden>
        <p class="end-text" id="g-err-text" role="alert"></p>
        <button type="button" class="btn retry-btn" id="g-retry" hidden>다시 시도</button>
        <button type="button" class="btn home-btn" id="g-home">홈으로</button>
      </div>
    </main>

    <main class="screen" id="result" hidden aria-label="결과 화면">
      <h2 class="r-title" id="r-title" tabindex="-1"></h2>
      <p class="r-reason" id="r-reason"></p>
      <section id="r-record" aria-label="이번 기록과 순위표"></section>
      <div class="r-actions">
        <button type="button" class="btn again-btn" id="r-again">다시 하기</button>
        <button type="button" class="btn home-btn" id="r-home">홈으로</button>
      </div>
      <section class="r-explain" id="r-explain" hidden aria-label="마지막 문제 해설">
        <h3 class="r-h">마지막 문제</h3>
        <p class="r-q" id="r-q"></p>
        <ul class="r-rows" id="r-rows"></ul>
        <p class="r-answer" id="r-answer"></p>
        <p class="refline" id="r-ref"></p><p class="refline" id="r-detail"></p>
      </section>
      <p class="refline" id="r-noexplain" hidden></p>
    </main>

    <footer class="source">
      <span id="source">자료: 행정안전부·한국국토정보공사(KOSIS), 기상청, USGS/Mapzen · 경계: VWorld / KnellBalm(2023) · 인천 신설 4구 모양 제외</span>
      <span class="data-date" id="data-date" hidden></span>
    </footer>
  </div>

  <noscript><p class="noscript">이 게임은 자바스크립트가 켜져 있어야 해요. 브라우저 설정을 확인해 주세요.</p></noscript>
  <script src="config.js"></script>
  <script src="features.js"></script>
  <script src="app.js"></script>
</body>
</html>
