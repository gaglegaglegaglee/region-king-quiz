<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>지역왕</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <main class="screen" id="home" aria-labelledby="title">
      <header class="hero">
        <h1 id="title">지역왕</h1>
        <p class="tagline" id="tagline">실제 공공데이터로 만든 지역 퀴즈, 몇 연승까지 갈 수 있을까?</p>
      </header>

      <section class="topics" id="topics" aria-label="주제 고르기"></section>

      <button type="button" class="btn rank-btn" id="rank-btn">🏆 순위표 보기</button>

      <p class="toast" id="toast" role="status" aria-live="polite"></p>
    </main>

    <main class="screen" id="game" hidden aria-label="게임 화면">
      <div class="game-top">
        <p class="streak" id="g-streak" aria-live="polite">🔥 <span id="g-streak-n">0</span>연승</p>
        <p class="qnum" id="g-num"></p>
      </div>
      <div class="timer" id="g-timer" aria-hidden="true"><div class="timer-fill" id="g-fill"></div></div>
      <h2 class="question" id="g-question"></h2>
      <div class="choices" id="g-choices"></div>
      <p class="verdict" id="g-verdict" role="status" aria-live="assertive"></p>
      <p class="refline" id="g-ref"></p>
      <div class="end" id="g-end" hidden>
        <p class="end-text" id="g-end-text"></p>
        <button type="button" class="btn retry-btn" id="g-retry" hidden>다시 시도</button>
        <button type="button" class="btn home-btn" id="g-home">홈으로</button>
      </div>
    </main>

    <footer class="source">
      <span id="source">자료: 통계청 KOSIS(행정안전부 주민등록 인구통계, 국토교통부) · 행정구역 경계: (준비 중)</span>
      <span class="data-date" id="data-date" hidden></span>
    </footer>
  </div>

  <noscript><p class="noscript">이 게임은 자바스크립트가 켜져 있어야 해요. 브라우저 설정을 확인해 주세요.</p></noscript>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
